services:
  mysql:
    image: mysql:8.0
    container_name: warkop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: warkop_db
    ports:
      - "3306:3306"
    volumes:
      - warkop_mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  warkop_mysql_data:

